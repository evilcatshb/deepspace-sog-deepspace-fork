plugins {
    id 'net.minecraftforge.gradle'              version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle'  version '1.2.0'
}

version         = '1.0.0'
group           = 'com.deepspace'
archivesBaseName = 'deepspace'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Official MCP mappings â€” no Parchment needed at all if the plugin can't resolve
    // Use 'official' as a safe fallback; swap back to parchment once plugin resolves.
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { deepspace { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { deepspace { source sourceSets.main } }
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url  = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'ParchmentMC'
        url  = 'https://maven.parchmentmc.org'
    }
    maven {
        // Mixin annotation processor
        name = 'SpongePowered'
        url  = 'https://repo.spongepowered.org/repository/maven-public'
    }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.3'
    // Tough As Nails thirst API is compile-time only; never bundled in DeepSpace.
    compileOnly(files('../../deepspace_1.0.0/data/mods/ToughAsNails-forge-1.20.1-9.2.0.171.jar'))

    // EMI client API used by the client-only EmiSearch concurrency guard
    compileOnly(files('libs/emi-1.1.24+1.20.1+forge.jar'))

    // Mixin annotation processor (required to compile @Mixin classes)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Optional Super Chat compile-time target for Mixin AP only. This is compileOnly:
    // it is never bundled and remains optional at runtime. The installed JAR is
    // currently named .disabled but is a valid ZIP/JAR for annotation processing.
    compileOnly(files('../../deepspace_1.0.0/data/mods/super_chat-3.1.0-forge-1.20.1.jar'))

    // Optional Genetic Animals target for Mixin annotation processing only; never bundled.
    compileOnly(files('../../deepspace_1.0.0/data/mods/GeneticAnimals-0_11_12.jar'))

    // Core deps â€” jars in libs/
    compileOnly(files('libs/gtceu-1_20_1-8_0_0-SNAPSHOT.jar'))
    // ModularUI is embedded in GTCEu 8.0.0; compile against the exact embedded jar.
    compileOnly(files('libs/modularui-mc1.20.1-3.3.1-SNAPSHOT.jar'))
    compileOnly(files('libs/ldlib-forge-1.20.1-1.0.27.b.jar'))
    compileOnly(files('libs/ad_astra-forge-1.20.1-1.15.21.jar'))
    compileOnly(files('libs/botarium-forge-1.20.1-2.3.4.jar'))
    compileOnly(files('libs/ftb-chunks-forge-2001_3_6.jar'))
    compileOnly(files('libs/appliedenergistics2-forge-15_4_10.jar'))

    // GuideME + Starlight: client-only GuidebookLevel/Starlight compatibility mixin
    compileOnly(files('../../deepspace_1.0.0/data/mods/guideme-20.1.15.jar'))
    compileOnly(files('../../deepspace_1.0.0/data/mods/starlight-1.1.2+forge.1cda73c.jar'))

    // Previously-missing deps â€” now all in libs/
    compileOnly(files('libs/kubejs-forge-2001_6_5-build_16.jar'))
    compileOnly(files('libs/lootr-forge-1.20-0.7.35.94.jar'))
    compileOnly(files('libs/architectury-9_2_14-forge.jar'))
    compileOnly(files('libs/ftb-library-forge-2001_2_10.jar'))
    compileOnly(files('libs/geckolib-forge-1_20_1-4_8_2.jar'))

    // Optional â€” /exportship command
    compileOnly(files('libs/worldedit-mod-7_2_15.jar'))

    // CC:Tweaked peripheral integration
    compileOnly(files('libs/cc-tweaked-1_20_1-forge-1_113_1.jar'))

    // Hardcore Revival + Balm (First Aid compat bridge)
    compileOnly(files('libs/hardcorerevival-forge-1.20.1-12.0.11.jar'))
    compileOnly(files('libs/balm-forge-1.20.1-7.3.37-all.jar'))

    // TACZ + GoProne â€“ for LocalPlayerCrawl prone-pose compat mixin
    compileOnly(files('libs/tacz-1.20.1-1.1.8-hotfix.jar'))
    compileOnly(files('libs/GoProne-forge-1.20.1-3.1.1.jar'))

    // Modular Routers â€“ for SecurityUpgrade owner-name fix mixin
    compileOnly(files('libs/modular-routers-12.1.1+mc1.20.1.jar'))
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'deepspace',
            'Specification-Vendor'    : 'deepspace',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'deepspace',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            // Register our mixin config so Forge/Mixin picks it up at runtime
            'MixinConfigs'            : 'deepspace.mixins.json'
        ])
    }
}

// Suppress Gradle 8 metadata validation warnings for local flat-dir jars
configurations.compileClasspath.resolutionStrategy.eachDependency { }

// â”€â”€ Fix 1: UTF-8 source encoding â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// Windows defaults to windows-1252; any emoji/non-ASCII in .java files fails.

// â”€â”€ Fix 2: Mixin AP obfuscation mapping â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// ForgeGradle 6's createSrgToMcp outputs SRGâ†’MCP (left=SRG, right=MCP).
// The Mixin AP's ObfuscationServiceMCP reads -AreobfSrgFile as leftâ†’right
// for reobfuscation, so it needs MCPâ†’SRG direction (the reverse).
// This task flips every CL:/FD:/MD: line so the AP can look up e.g.
// "tick" (MCP, left) â†’ "m_8119_" (SRG, right).
task reverseSrgMappings {
    dependsOn 'createSrgToMcp'
    def inputSrg  = file("${buildDir}/createSrgToMcp/output.srg")
    def outputSrg = file("${buildDir}/createSrgToMcp/output_mcp2srg.srg")
    inputs.file(inputSrg)
    outputs.file(outputSrg)

    doLast {
        def sb = new StringBuilder()
        inputSrg.eachLine { line ->
            line = line.trim()
            if (line.isEmpty() || line.startsWith('#')) return

            if (line.startsWith('CL: ')) {
                def parts = line.substring(4).trim().split('\\s+')
                if (parts.length >= 2) sb.append("CL: ${parts[1]} ${parts[0]}\n")
            } else if (line.startsWith('FD: ')) {
                def parts = line.substring(4).trim().split('\\s+')
                if (parts.length >= 2) sb.append("FD: ${parts[1]} ${parts[0]}\n")
            } else if (line.startsWith('MD: ')) {
                def parts = line.substring(4).trim().split('\\s+')
                if (parts.length >= 4) sb.append("MD: ${parts[2]} ${parts[3]} ${parts[0]} ${parts[1]}\n")
            }
        }
        outputSrg.text = sb.toString()
        logger.lifecycle("[Mixin] Reversed SRG (MCP->SRG): written to ${outputSrg.name}")
    }
}

afterEvaluate {
    def reobfSrg   = new File(buildDir, 'createSrgToMcp/output_mcp2srg.srg')
    // Write the refmap directly into the resources output directory so
    // processResources / jar picks it up automatically.  The name must
    // match the "refmap" field in deepspace.mixins.json.
    def refmapFile = new File(buildDir, 'resources/main/deepspace.refmap.json')

    tasks.withType(JavaCompile).configureEach { task ->
        task.options.encoding = 'UTF-8'   // Fix 1
        if (task.name == 'compileJava') {
            task.dependsOn('reverseSrgMappings')
            task.options.compilerArgs.addAll([
                '-AreobfSrgFile='  + reobfSrg.absolutePath,
                '-AoutRefMapFile=' + refmapFile.absolutePath
            ])
        }
    }
}



